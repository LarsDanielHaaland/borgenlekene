<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Event App{% endblock %}</title>
    <!-- Add link to basic CSS or a framework like Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; padding-bottom: 20px; }
        .nickname-list li { display: flex; justify-content: space-between; margin-bottom: 5px; padding: 5px; border: 1px solid #eee; }
        .score-actions button { margin: 2px; }
        .messages { list-style: none; padding: 0; }
        .messages .alert { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1><a href="{% url 'event_list' %}" class="text-decoration-none">Event Scoreboard</a></h1>
            <a href="{% url 'event_create' %}" class="btn btn-primary">Create New Event</a>
        </header>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}" role="alert">
                {{ message }}
            </li>
            {% endfor %}
        </ul>
        {% endif %}

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer class="mt-5 text-muted text-center">
            Simple Event App
        </footer>
    </div>
    <!-- Optional: Add Bootstrap JS if needed for components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
